<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="/juzu/manifest.webmanifest" />
    <!-- P-MOBILE F11: Add-to-Home-Screen launches standalone full-bleed
         (no Safari chrome) instead of a regular browser tab. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Juzu" />
    <meta name="theme-color" content="#000000" />
    <link rel="apple-touch-icon" href="/juzu/icons/apple-touch-icon.png" />
    <title>Juzu</title>
    <style>
      body, #app canvas {
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        /* P-MOBILE: no gray flash on tap, no long-press callout on iOS. */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        margin: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* Safe area insets for UI if any */
      #ui-root {
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      #ui-root button {
        touch-action: manipulation;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
